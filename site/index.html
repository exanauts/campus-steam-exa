<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example University</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbf9;
    --fg: #1d2125;
    --muted: #5a636b;
    --rule: #d9dcdf;
    --link: #0b5cad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181b;
      --fg: #e7e9eb;
      --muted: #a3acb4;
      --rule: #30363c;
      --link: #7db8f2;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main, footer {
    width: 100%;
    max-width: 44rem;
    margin: 0 auto;
    padding: 0 1rem;
  }
  main { flex: 1; padding-top: 3rem; padding-bottom: 3rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.75rem; line-height: 1.2; }
  p { margin: 0; }
  footer { padding-top: 1rem; padding-bottom: 1.5rem; color: var(--muted); font-size: .875rem; }
  .rule { border-top: 1px solid var(--rule); padding-top: 1rem; }
  dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .25rem 1rem; margin: 0; }
  dt { font-weight: 600; }
  dd { margin: 0; overflow-wrap: anywhere; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Example University</h1>
  <p>This site is a placeholder.</p>
</main>
<footer>
  <div class="rule">
    <dl>
      <dt>Commit</dt><dd id="commit">unavailable</dd>
      <dt>Run date</dt><dd id="run-date">unavailable</dd>
      <dt>Runner</dt><dd id="hardware">unavailable</dd>
    </dl>
  </div>
</footer>
<script>
  (async function () {
    let info;
    try {
      const response = await fetch("data/build_info.json", { cache: "no-store" });
      if (!response.ok) return;
      info = await response.json();
    } catch (error) {
      return;
    }
    if (typeof info.commit_sha === "string" && /^[0-9a-f]{40}$/.test(info.commit_sha)) {
      const link = document.createElement("a");
      link.href = "https://github.com/exanauts/campus-steam-exa/commit/" + info.commit_sha;
      const code = document.createElement("code");
      code.textContent = info.commit_sha.slice(0, 12);
      link.appendChild(code);
      document.getElementById("commit").replaceChildren(link);
    }
    if (info.run_date) document.getElementById("run-date").textContent = info.run_date;
    const hardware = [info.cpu_model, info.gpu_model].filter(Boolean).join(" / ");
    if (hardware) document.getElementById("hardware").textContent = hardware;
  })();
</script>
</body>
</html>
