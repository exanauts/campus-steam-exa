name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-steam-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, gpu, cuda, kkt]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI_JULIA_VERSION: "1.13.3"
      # Never scheduled on these GPUs, whatever their memory use.
      GPU_EXCLUDE: "0,1"
    steps:
      # Plain git and scripts/ci instead of actions/checkout and setup-julia:
      # those actions print absolute runner paths in the public job log.
      - name: Check out commit
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx

      - name: Select GPU with least memory in use
        run: scripts/ci/select_gpu.sh

      - name: Install Julia
        run: scripts/ci/setup_julia.sh

      # The depot persists in the runner tool cache between runs. It is not sent
      # to the Actions cache, which pull requests on a public repository can read.
      - name: Instantiate Julia project
        run: |
          source scripts/ci/env.sh
          julia --color=no --project=scripts -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()' 2>&1 | scrub

      - name: Print CUDA version info
        run: |
          source scripts/ci/env.sh
          julia --color=no --project=scripts -e 'using CUDA; CUDA.versioninfo()' 2>&1 | scrub

      - name: Build site data
        run: |
          source scripts/ci/env.sh
          julia --color=no --project=scripts scripts/run_site.jl 2>&1 | scrub

      - name: Upload site files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: site
          if-no-files-found: error
          retention-days: 1

  # Packaging runs on a GitHub-hosted runner: upload-pages-artifact logs the
  # absolute temp path of the machine it runs on.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: site

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
