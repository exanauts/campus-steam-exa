name: site

# Builds the site data on the GPU runners, in three parallel parts, and publishes it to the gh-pages branch.
#   push to main          -> the public site
#   pull request          -> a preview under preview/pr-<number>/, removed when the request closes
# Pull requests build only from branches of this repository, which only members and collaborators
# can push. Requests from forks are skipped, so their code never reaches the self-hosted runner.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch or pull request cancels the build of the older one.
concurrency:
  group: site-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  # The site data is built in three parts that run at the same time on separate runners of one
  # machine. Each part uploads its share of site/data/, and `merge` combines them into one artifact.
  # The benchmark part holds a GPU of its own so that its timings are not disturbed by the other
  # parts; scenarios (CPU only) and calibration share the other GPU (scripts/ci/select_gpu.sh).
  # Scenarios and calibration run their independent solves on a pool of worker processes.
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    name: build (${{ matrix.part }})
    runs-on: [self-hosted, Linux, X64, gpu, cuda, kkt]
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          # `workers` is the size of the part's pool of solver processes (scripts/site/pool.jl).
          # The benchmark part stays serial. scripts/ci/cpu_set.sh pins each part to its own cores,
          # and the two pooled parts also run at a lower CPU priority than the benchmark solves.
          # Scenarios: 13 solves (the scenarios and the new-building study).
          - part: scenarios
            gpu_role: shared
            workers: 6
            nice: 10
          - part: calibration
            gpu_role: shared
            workers: 8
            nice: 10
          - part: benchmarks
            gpu_role: exclusive
            workers: 1
            nice: 0
    defaults:
      run:
        shell: bash
    env:
      CI_JULIA_VERSION: "1.13.3"
      # Never scheduled on these GPUs, whatever their memory use.
      GPU_EXCLUDE: "0,1"
      GPU_PART: ${{ matrix.part }}
      SITE_WORKERS: ${{ matrix.workers }}
      # A pull request builds its head commit, not the merge commit GitHub prepares.
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Plain git and scripts/ci instead of actions/checkout and setup-julia:
      # those actions print absolute runner paths in the public job log.
      - name: Check out commit
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$BUILD_SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx

      - name: Select GPU
        run: scripts/ci/select_gpu.sh ${{ matrix.gpu_role }}

      - name: Install Julia
        run: scripts/ci/setup_julia.sh

      # The depot persists in the runner tool cache between runs. It is not sent
      # to the Actions cache, which pull requests on a public repository can read.
      - name: Instantiate Julia project
        run: |
          source scripts/ci/env.sh
          julia --color=no --project=scripts -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()' 2>&1 | scrub

      - name: Print CUDA version info
        run: |
          source scripts/ci/env.sh
          julia --color=no --project=scripts -e 'using CUDA; CUDA.versioninfo()' 2>&1 | scrub

      - name: Build site data (${{ matrix.part }})
        run: |
          source scripts/ci/env.sh
          # The build records this commit in the page footer.
          export GITHUB_SHA="$BUILD_SHA"
          pin=()
          cpus="$(scripts/ci/cpu_set.sh "$GPU_PART")"
          if [ -n "$cpus" ]; then
            echo "Pinned to CPUs $cpus"
            pin=(taskset -c "$cpus")
          fi
          nice -n ${{ matrix.nice }} "${pin[@]}" julia --color=no --project=scripts scripts/run_site.jl "$GPU_PART" 2>&1 | scrub

      - name: Release GPU
        if: always()
        run: scripts/ci/select_gpu.sh release

      - name: Upload site data (${{ matrix.part }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-part-${{ matrix.part }}
          path: site/data
          if-no-files-found: error
          retention-days: 1

  # Combines the three parts, writes build_info.json and files.json, and hands one artifact to deploy.
  merge:
    needs: build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, gpu, cuda, kkt]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI_JULIA_VERSION: "1.13.3"
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out commit
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$BUILD_SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx

      - name: Install Julia
        run: scripts/ci/setup_julia.sh

      - name: Instantiate Julia project
        run: |
          source scripts/ci/env.sh
          julia --color=no --project=scripts -e 'using Pkg; Pkg.instantiate()' 2>&1 | scrub

      - name: Download site data parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-part-*
          path: site/data
          merge-multiple: true

      - name: Merge site data
        run: |
          source scripts/ci/env.sh
          julia --color=no --project=scripts scripts/run_site.jl merge 2>&1 | scrub

      - name: Finish site data
        run: scripts/ci/finish_site_data.sh

      - name: Upload site files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: site
          if-no-files-found: error
          retention-days: 1

  # Publishing runs on a GitHub-hosted runner and is the only job that can write to the repository.
  deploy:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Download site files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: site

      - name: Check out publishing script
        run: |
          git init -q repo
          git -C repo fetch -q --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C repo checkout -q FETCH_HEAD -- scripts/ci/publish_pages.sh

      - name: Publish
        run: |
          if [ -n "$PR_NUMBER" ]; then
            bash repo/scripts/ci/publish_pages.sh preview "$PR_NUMBER" site
          else
            bash repo/scripts/ci/publish_pages.sh site site
          fi

      - name: Link the preview on the pull request
        if: github.event_name == 'pull_request'
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/preview/pr-${PR_NUMBER}/"
          body="Preview of this pull request: ${url}

          Built from commit ${{ github.event.pull_request.head.sha }}. It updates on each push and is removed when the pull request closes. The page can take a minute to appear after this comment."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

  remove-preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out publishing script
        run: |
          git init -q repo
          git -C repo fetch -q --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "${{ github.event.pull_request.base.sha }}"
          git -C repo checkout -q FETCH_HEAD -- scripts/ci/publish_pages.sh

      - name: Remove the preview
        run: bash repo/scripts/ci/publish_pages.sh remove "$PR_NUMBER"
